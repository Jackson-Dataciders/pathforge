id: sum-two-numbers
title: Add two numbers
prompt: Write a function named `sum` that returns the sum of two numbers.
language: javascript
starter: |-
  function sum(a, b) {
    return 0;
  }
solution: |-
  function sum(a, b) {
    return a + b;
  }
tests: |-
  test('adds positive numbers', () => assert.equal(sum(2, 3), 5));
  test('adds a negative number', () => assert.equal(sum(-2, 5), 3));
  test('adds zero', () => assert.equal(sum(0, 0), 0));
hints:
  - Return the result of the `+` operator.
timeout_ms: 5000
