id: growth-rates
title: Compare growth rates
x:
  min: 1
  max: 100
  label: Input size n
params:
  - name: c
    label: Constant c
    min: 0
    max: 5
    step: 0.1
    value: 1
series:
  - expression: x
    label: n
  - expression: c*x*log(x)
    label: c n log(n)
  - expression: x^2
    label: n^2